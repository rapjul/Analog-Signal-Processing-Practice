<!doctype html>
<html
	lang="en"
	data-theme="dark"
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>SignalLab — Analog Signal Processing Practice Workbench</title>
		<meta
			name="description"
			content="Offline-first Progressive Web App for practicing Analog Signal Processing math, ODEs, Fourier series, CTFT, Laplace, and circuits."
		/>
		<meta
			name="theme-color"
			content="#0f172a"
		/>
		<meta
			name="color-scheme"
			content="dark"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="SignalLab"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Main-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Math-Italic.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Size1-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_AMS-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="stylesheet"
			href="%sveltekit.assets%/katex/katex.min.css"
		/>
		<script>
			(() => {
				var savedTheme = localStorage.getItem("theme");
				var theme = savedTheme || "dark";
				document.documentElement.setAttribute("data-theme", theme);
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div class="app-contents">%sveltekit.body%</div>
	</body>
</html>
