<!doctype html>
<html
	lang="en"
	data-theme="dark"
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self';"
		/>
		<title>SignalLab — Analog Signal Processing Practice Workbench</title>
		<meta
			name="description"
			content="Offline-first Progressive Web App for practicing Analog Signal Processing math, ODEs, Fourier series, CTFT, Laplace, and circuits."
		/>
		<meta
			name="theme-color"
			content="#0f172a"
		/>
		<meta
			name="color-scheme"
			content="dark light"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="SignalLab"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Main-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Math-Italic.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_Size1-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/katex/fonts/KaTeX_AMS-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="stylesheet"
			href="%sveltekit.assets%/katex/katex.min.css"
		/>
		<script>
			/** Restores the saved theme without requiring browser storage access. */
			(() => {
				var savedTheme = null;
				try {
					savedTheme = localStorage.getItem("theme");
				} catch {
					// Use the default theme when browser privacy settings block storage.
				}
				var theme = savedTheme === "light" ? "light" : "dark";
				document.documentElement.setAttribute("data-theme", theme);
				var themeColorMeta = document.querySelector(
					'meta[name="theme-color"]',
				);
				if (themeColorMeta) {
					themeColorMeta.setAttribute(
						"content",
						theme === "light" ? "#f8fafc" : "#0f172a",
					);
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div class="app-contents">%sveltekit.body%</div>
	</body>
</html>
