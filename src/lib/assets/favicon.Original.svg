<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- SignalLab Math-focused Analog Signal Processing Favicon -->
  <defs>
    <!-- Background Gradient (Deep Slate & Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Signal Wave Gradient (Vibrant Cyan-Indigo-Rose) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Integral Math Symbol Gradient (Teal to Electric Blue) -->
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter for Favicon Crisp Visibility in Browser Tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- s-Plane / Coordinate Grid Lines (Sigma and j*Omega axes for Laplace domain) -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.45"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" opacity="0.45"/>

  <!-- Integral Sign (∫) representing Continuous-Time Calculus & Laplace/Fourier Transforms -->
  <path d="M 37 13 C 31.5 13 29.5 15.5 29.5 19.5 L 29.5 44.5 C 29.5 48.5 27.5 51 22 51" fill="none" stroke="url(#mathGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Damped Continuous Analog Signal Wave e^(-at)*sin(wt) -->
  <path d="M 8 32 C 12 11, 20 11, 25 32 C 30 50, 36 50, 41 32 C 45 20, 49 20, 52 32 C 54 37, 55 35, 56 32" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Complex Pole Pair (x) on s-plane -->
  <g stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round">
    <!-- Upper Left Pole -->
    <line x1="17" y1="18" x2="23" y2="24"/>
    <line x1="23" y1="18" x2="17" y2="24"/>
    <!-- Lower Left Pole -->
    <line x1="17" y1="40" x2="23" y2="46"/>
    <line x1="23" y1="40" x2="17" y2="46"/>
  </g>
</svg>