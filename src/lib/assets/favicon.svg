<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <title>SignalLab Favicon</title>
  <!-- SignalLab Math-focused S-Plane & Laplace Transform Favicon -->
  <defs>
    <!-- Integral Math Symbol Gradient -->
    <linearGradient id="integralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Region of Convergence (ROC) Shading Gradient (Seamless Fade) -->
    <linearGradient id="rocGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Base Icon Container (Solid Dark Background, No Gradient) -->
  <rect id="base" x="2" y="2" width="60" height="60" rx="14" fill="#121214" stroke="#2d2d35"
    stroke-width="1.5" />

  <!-- Region of Convergence (ROC): Re(s) > σ_pole (Shaded Causal Half-Plane) -->
  <path id="roc" d="M 17 8 H 50 A 6 6 0 0 1 56 14 V 50 A 6 6 0 0 1 50 56 H 17 Z"
    fill="url(#rocGrad)"
    stroke="none" shape-rendering="geometricPrecision" />
  <!-- ROC Boundary Line at Re(s) = σ_pole -->
  <line id="roc-line" x1="17" y1="8" x2="17" y2="56" stroke="#38bdf8" stroke-width="1"
    stroke-dasharray="3 2" opacity="0.6" />

  <!-- s-Plane Coordinate Axes: Real Axis (σ) and Imaginary Axis (jω) -->
  <line id="real-axis" x1="8" y1="32" x2="56" y2="32" stroke="#64748b" stroke-width="1.5" />
  <line id="imag-axis" x1="32" y1="8" x2="32" y2="56" stroke="#64748b" stroke-width="1.5" />

  <!-- Integral Sign (∫) representing Continuous-Time Calculus & Laplace Transforms -->
  <path id="integral" d="M 49 14 C 44.5 14 43 16 43 19.5 L 43 44.5 C 43 48 41.5 50 37 50"
    fill="none" stroke="url(#integralGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75" />

  <!-- Zero Circle Marker (◯) on s-plane (Real Axis) -->
  <circle id="zero" cx="25" cy="32" r="3" fill="none" stroke="#2dd4bf" stroke-width="2" />

  <!-- Complex Conjugate Pole Pair Markers (✕) on s-plane -->
  <g id="poles" stroke="#f43f5e" stroke-width="2" stroke-linecap="round">
    <!-- Upper Left Pole -->
    <line x1="14" y1="17" x2="20" y2="23" />
    <line x1="20" y1="17" x2="14" y2="23" />
    <!-- Lower Left Pole -->
    <line x1="14" y1="41" x2="20" y2="47" />
    <line x1="20" y1="41" x2="14" y2="47" />
  </g>
</svg>
